<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>

    <filter id="blob-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="46"/>
    </filter>
    <filter id="blob-blur-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22"/>
    </filter>

    <style>
      @keyframes drift {
        0%,100% { transform: translate(0px, 0px); }
        30%      { transform: translate(22px, -14px); }
        65%      { transform: translate(-8px, 11px); }
      }
      @keyframes drift2 {
        0%,100% { transform: translate(0px, 0px); }
        40%      { transform: translate(-26px, 13px); }
        72%      { transform: translate(17px, -11px); }
      }
      @keyframes breathe {
        0%,100% { opacity: 0.07; }
        50%      { opacity: 0.15; }
      }
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0px);  }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      .blob1 { animation: drift    16s ease-in-out infinite; }
      .blob2 { animation: drift2   21s ease-in-out infinite; }
      .blob3 { animation: breathe   9s ease-in-out infinite; }
      .blob4 { animation: drift    25s ease-in-out infinite reverse; }
      .blob5 { animation: drift2   18s ease-in-out infinite reverse; }

      .name  { animation: slide-up 0.7s ease-out 0.10s forwards; }
      .title { animation: slide-up 0.7s ease-out 0.22s forwards; }
      .tag1  { animation: slide-up 0.7s ease-out 0.36s forwards; }
      .tag2  { animation: slide-up 0.7s ease-out 0.46s forwards; }
      .meta  { animation: fade-in  1.0s ease-out 0.80s forwards; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="#0f0f0e" rx="12"/>

  <!-- Organic blobs -->
  <ellipse class="blob1" cx="120" cy="80"  rx="230" ry="145" fill="#c6613f" opacity="0.15" filter="url(#blob-blur)"/>
  <ellipse class="blob2" cx="790" cy="240" rx="250" ry="160" fill="#d97757" opacity="0.12" filter="url(#blob-blur)"/>
  <ellipse class="blob3" cx="450" cy="330" rx="300" ry="120" fill="#c6613f" opacity="0.09" filter="url(#blob-blur)"/>
  <ellipse class="blob4" cx="860" cy="44"  rx="100" ry="68"  fill="#d97757" opacity="0.11" filter="url(#blob-blur-sm)"/>
  <ellipse class="blob5" cx="300" cy="280" rx="140" ry="80"  fill="#b55530" opacity="0.08" filter="url(#blob-blur-sm)"/>

  <!-- Left accent bar -->
  <rect x="48" y="58" width="2.5" height="186" fill="#c6613f" rx="1.5" opacity="0.90"/>

  <!-- Name -->
  <text class="name" x="62" y="112"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="54" font-weight="700" fill="#faf9f5" letter-spacing="-1.5"
        opacity="1">
    Ian Kinoti
  </text>

  <!-- Title — full stack -->
  <text class="title" x="65" y="145"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="15" font-weight="500" fill="#c6613f" letter-spacing="0.5"
        opacity="1">
    Software Engineer · AI Engineer · Creative Technologist
  </text>

  <!-- Tagline — line 1 -->
  <text class="tag1" x="65" y="186"
        font-family="Georgia,'Times New Roman',serif"
        font-size="14" fill="#87867f" font-style="italic"
        opacity="1">
    I build intelligent systems, expressive interfaces,
  </text>

  <!-- Tagline — line 2 -->
  <text class="tag2" x="65" y="207"
        font-family="Georgia,'Times New Roman',serif"
        font-size="14" fill="#87867f" font-style="italic"
        opacity="1">
    and digital products designed around people.
  </text>

  <!-- Divider -->
  <line x1="62" y1="248" x2="838" y2="248" stroke="#2a2a28" stroke-width="0.8"/>

  <!-- Meta row -->
  <text class="meta" x="65"  y="270" font-family="ui-monospace,'SF Mono',monospace" font-size="11.5" fill="#87867f" letter-spacing="0.2" opacity="1">Nairobi, Kenya</text>
  <text class="meta" x="178" y="270" font-family="ui-monospace,monospace"           font-size="11.5" fill="#2a2a28" opacity="1">·</text>
  <text class="meta" x="192" y="270" font-family="ui-monospace,'SF Mono',monospace" font-size="11.5" fill="#87867f" letter-spacing="0.2" opacity="1">TypeScript · Python · React</text>
  <text class="meta" x="430" y="270" font-family="ui-monospace,monospace"           font-size="11.5" fill="#2a2a28" opacity="1">·</text>
  <text class="meta" x="444" y="270" font-family="ui-monospace,'SF Mono',monospace" font-size="11.5" fill="#c6613f" letter-spacing="0.2" opacity="1">Open to work and collaboration.</text>

</svg>
