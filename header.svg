<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290">
  <defs>
    <filter id="glow-blob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="38" result="blur"/>
    </filter>
    <filter id="glow-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; r: 5px; }
        50% { opacity: 0.35; r: 7px; }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .name { animation: slide-up 0.8s ease-out 0.1s both; }
      .sub  { animation: slide-up 0.8s ease-out 0.3s both; }
      .tag  { animation: slide-up 0.8s ease-out 0.5s both; }
      .meta { animation: fade-in 1.2s ease-out 0.8s both; }
      .live-dot { animation: pulse 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="290" fill="#1A1612" rx="12"/>

  <!-- Organic blobs -->
  <ellipse cx="120" cy="70"  rx="200" ry="130" fill="#C96442" opacity="0.13" filter="url(#glow-blob)"/>
  <ellipse cx="760" cy="210" rx="220" ry="140" fill="#8B5E3C" opacity="0.11" filter="url(#glow-blob)"/>
  <ellipse cx="460" cy="290" rx="280" ry="110" fill="#C96442" opacity="0.08" filter="url(#glow-blob)"/>
  <ellipse cx="830" cy="40"  rx="90"  ry="60"  fill="#D4804A" opacity="0.09" filter="url(#glow-sm)"/>

  <!-- Left accent bar -->
  <rect x="48" y="68" width="3" height="148" fill="#C96442" rx="2" opacity="0.8"/>

  <!-- Live indicator -->
  <circle class="live-dot" cx="68" cy="52" r="5" fill="#C96442"/>
  <text x="80" y="57" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" fill="#8B7355" letter-spacing="2">LIVE</text>

  <!-- Name -->
  <text class="name" x="60" y="138"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="62" font-weight="700" fill="#F5EFE0" letter-spacing="-1.5">Ian Kinoti</text>

  <!-- Subtitle -->
  <text class="sub" x="63" y="175"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="17" fill="#8B7355" letter-spacing="0.8">
    Software Engineer &nbsp;·&nbsp; TypeScript &nbsp;·&nbsp; Python &nbsp;·&nbsp; React
  </text>

  <!-- Tagline -->
  <text class="tag" x="63" y="212"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="15" fill="#C96442" font-style="italic">
    Building interfaces that feel inevitable.
  </text>

  <!-- Divider -->
  <line x1="60" y1="240" x2="840" y2="240" stroke="#3D3020" stroke-width="1"/>

  <!-- Bottom meta row -->
  <text class="meta" x="63" y="264"
        font-family="ui-monospace, 'SF Mono', monospace"
        font-size="12" fill="#4A3E2E" letter-spacing="0.3">
    76 repos
  </text>
  <text class="meta" x="148" y="264" font-family="ui-monospace, monospace" font-size="12" fill="#3D3020">·</text>
  <text class="meta" x="163" y="264"
        font-family="ui-monospace, 'SF Mono', monospace"
        font-size="12" fill="#4A3E2E" letter-spacing="0.3">
    TypeScript · Python · JavaScript
  </text>
  <text class="meta" x="430" y="264" font-family="ui-monospace, monospace" font-size="12" fill="#3D3020">·</text>
  <text class="meta" x="445" y="264"
        font-family="ui-monospace, 'SF Mono', monospace"
        font-size="12" fill="#4A3E2E" letter-spacing="0.3">
    Nairobi, Kenya
  </text>
  <text class="meta" x="565" y="264" font-family="ui-monospace, monospace" font-size="12" fill="#3D3020">·</text>
  <text class="meta" x="580" y="264"
        font-family="ui-monospace, 'SF Mono', monospace"
        font-size="12" fill="#4A3E2E" letter-spacing="0.3">
    Open to work
  </text>
</svg>
