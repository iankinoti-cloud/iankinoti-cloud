name: Update Profile

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-activity:
    name: Update Activity Feed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and format recent activity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const { data: events } = await github.rest.activity.listPublicEventsForUser({
              username: 'iankinoti-cloud',
              per_page: 10,
            });

            const format = e => {
              const repo = e.repo.name;
              switch (e.type) {
                case 'PushEvent': {
                  const n = e.payload.commits?.length ?? 0;
                  return `Pushed ${n} commit${n !== 1 ? 's' : ''} to ${repo}`;
                }
                case 'PullRequestEvent': {
                  const a = e.payload.action;
                  const merged = e.payload.pull_request?.merged;
                  const verb = a === 'opened' ? 'Opened PR in' : merged ? 'Merged PR in' : 'Updated PR in';
                  return `${verb} ${repo}`;
                }
                case 'CreateEvent': {
                  const ref = e.payload.ref ? ` "${e.payload.ref}"` : '';
                  return `Created ${e.payload.ref_type}${ref} in ${repo}`;
                }
                case 'IssuesEvent':
                  return `${e.payload.action === 'opened' ? 'Opened' : 'Updated'} issue in ${repo}`;
                case 'IssueCommentEvent':
                  return `Commented on issue in ${repo}`;
                case 'ForkEvent':
                  return `Forked ${repo}`;
                case 'WatchEvent':
                  return `Starred ${repo}`;
                case 'ReleaseEvent':
                  return `Released ${e.payload.release?.tag_name ?? 'new version'} of ${repo}`;
                case 'DeleteEvent':
                  return `Deleted ${e.payload.ref_type} in ${repo}`;
                default:
                  return null;
              }
            };

            const lines = events
              .map(format)
              .filter(Boolean)
              .slice(0, 5)
              .map(l => `- ${l}`)
              .join('\n');

            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!--START_SECTION:activity-->[\s\S]*?<!--END_SECTION:activity-->/,
              `<!--START_SECTION:activity-->\n${lines}\n<!--END_SECTION:activity-->`
            );
            fs.writeFileSync('README.md', updated);

      - name: Commit activity update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update activity"
          git push

  generate-snake:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: iankinoti-cloud
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
